services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in infra/.env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in infra/.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in infra/.env}
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    working_dir: /var/www/html
    volumes:
      - ../test-manager-library-3413974-api-main:/var/www/html
    ports:
      - "8000:8000"
    environment:
      APP_ENV: local
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY:?Set APP_KEY in infra/.env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in infra/.env}
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_DB:?Set POSTGRES_DB in infra/.env}
      DB_USERNAME: ${POSTGRES_USER:?Set POSTGRES_USER in infra/.env}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in infra/.env}
      ADMIN_USERNAME: ${ADMIN_USERNAME:?Set ADMIN_USERNAME in infra/.env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in infra/.env}
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "
      if [ ! -f vendor/autoload.php ]; then composer install --no-interaction --prefer-dist; fi &&
      php artisan serve --host=0.0.0.0 --port=8000 --no-reload
      "

  app:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ../test-manager-library-3413974-app-main:/app
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8000/api/v1
    command: >
      sh -c "
      if [ ! -d node_modules ]; then npm ci; fi &&
      npm run dev -- --host 0.0.0.0
      "

volumes:
  db-data:
